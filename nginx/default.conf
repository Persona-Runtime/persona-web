server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # health는 워크로드 probe 전용이며 프록시가 캐시하면 안 된다.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 같은 origin의 Gateway 경로는 이 컨테이너가 아니라 Traefik이 담당한다.
    # 여기서 404를 반환해 누락되거나 순서가 잘못된 경로를 앱 응답으로 숨기지 않는다.
    location = /v1 {
        return 404;
    }

    location ^~ /v1/ {
        return 404;
    }

    # Vite가 이 자산에 내용 해시를 붙이므로, 실제 파일만 전체 수명 동안 캐시할 수 있다.
    location ^~ /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 배포 중 새 manifest의 자산 요청이 이전 Pod에 도착할 수 있다. 404를 장기 캐시하면
    # 새 Pod가 준비된 뒤에도 브라우저가 복구하지 못하므로, 누락 응답은 저장하지 않는다.
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 새 자산 manifest를 사용하도록 HTML shell은 항상 재검증한다.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 아직 클라이언트 라우트가 없다. 특히 누락 경로를 index.html로 바꾸지 않아
    # 깨진 정적 URL이 404 응답으로 관측되게 한다.
    location / {
        try_files $uri =404;
    }
}
