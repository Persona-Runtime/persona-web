server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # health는 워크로드 probe 전용이며 프록시가 캐시하면 안 된다.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 같은 origin의 Gateway 경로는 이 컨테이너가 아니라 Traefik이 담당한다.
    # 여기서 404를 반환해 누락되거나 순서가 잘못된 경로를 앱 응답으로 숨기지 않는다.
    location = /v1 {
        return 404;
    }

    location ^~ /v1/ {
        return 404;
    }

    # Vite가 이 자산에 내용 해시를 붙이므로, 실제 파일만 전체 수명 동안 캐시할 수 있다.
    location ^~ /assets/ {
        try_files $uri @missing_asset;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 배포 중 새 manifest의 자산 요청이 이전 Pod에 도착할 수 있다. 404를 장기 캐시하면
    # 새 Pod가 준비된 뒤에도 브라우저가 복구하지 못하므로, 누락 응답은 저장하지 않는다.
    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 새 자산 manifest를 사용하도록 HTML shell은 항상 재검증한다.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 클라이언트 라우트는 /personas 이하에만 있다. 새로고침·딥링크가 동작하려면
    # 이 경로들이 앱 셸을 받아야 하므로 여기서만 index.html로 되돌린다.
    # 정규식 location은 위의 ^~ 접두 매치(/v1/, /assets/) 다음에 평가되므로
    # 그 규칙들을 가리지 않는다. 앱에 라우트를 추가하면 이 블록도 함께 갱신한다.
    location ~ ^/personas(/.*)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 앱 라우트가 아닌 알 수 없는 경로는 계속 404로 남긴다. 전부 index.html로
    # 되돌리면 깨진 정적 URL이 200 응답 뒤에 숨어 관측되지 않는다.
    location / {
        try_files $uri =404;
    }
}
